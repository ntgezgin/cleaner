name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install a trash tool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y trash-cli
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke scan of the runner's home (read-only)
        run: python -m disk_cleaner --home-only --no-docker -o smoke-report.html --json smoke-report.json
      - name: Build single-file zipapp
        run: |
          python tools/build_pyz.py
          python dist/disk-cleaner.pyz --version
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: disk-cleaner-${{ matrix.os }}
          path: |
            dist/disk-cleaner.pyz
            smoke-report.html
